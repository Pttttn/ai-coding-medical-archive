[project]
name = "local-medical-ai"
version = "0.1.0"
description = "Local-only extraction, hybrid Corrective RAG and synthetic MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.0",
  "fastmcp==2.14.3",
  "uvicorn==0.40.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic-settings==2.12.0",
  "chromadb==1.4.0",
  "langchain-classic==1.0.1",
  "langchain-text-splitters==1.1.0",
  "langgraph==1.0.5",
  "rank-bm25==0.2.2",
  "pypdf==6.5.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.11", "reportlab==4.4.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

