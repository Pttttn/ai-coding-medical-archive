server {
    listen 11434;
    server_name _;
    access_log off;
    client_max_body_size 20m;
    location ~ ^/api/(chat|generate|embed|embeddings|tags|show|version|ps)$ {
        proxy_pass http://llama-shim:11435;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
    location / { return 403; }
}
