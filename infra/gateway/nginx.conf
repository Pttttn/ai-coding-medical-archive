# DNS-rebinding guard: ports are published on loopback only, so the only valid
# Host is a loopback name. A browser Origin, when present, must be this exact
# gateway origin; MCP/CLI clients without Origin stay allowed. Browser MCP
# clients (Inspector direct mode) may come from any loopback origin, as in the
# MCP SDK defaults: the MCP corpus is synthetic.
map $http_host $archive_host_allowed {
    default 0;
    "~*^(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$" 1;
}
map "$http_origin#$http_host" $archive_origin_allowed {
    default 0;
    "~^#" 1;
    "~^http://([^#/]+)#\1$" 1;
}
map $http_origin $archive_mcp_origin_allowed {
    default 0;
    "" 1;
    "~*^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$" 1;
}
server {
    listen 8080;
    server_name localhost;
    client_max_body_size 21m;
    access_log off;
    if ($archive_host_allowed = 0) { return 403; }
    if ($archive_origin_allowed = 0) { return 403; }
    location / {
        proxy_pass http://frontend:80;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
    }
}
server {
    listen 3000;
    server_name localhost;
    client_max_body_size 21m;
    access_log off;
    if ($archive_host_allowed = 0) { return 403; }
    if ($archive_origin_allowed = 0) { return 403; }
    location / {
        proxy_pass http://backend:3000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
    }
}
server {
    listen 8002;
    server_name localhost;
    access_log off;
    if ($archive_host_allowed = 0) { return 403; }
    if ($archive_mcp_origin_allowed = 0) { return 403; }
    location /mcp {
        proxy_pass http://ai:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / { return 404; }
}
